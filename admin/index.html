<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindBridge Admin Portal | Dynamic Healthcare Operations & RBAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Clear any service worker that might interfere with admin assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) {
            r.unregister();
          }
        }).catch(function() {});
      }
      // Catch global unhandled script failures
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('mb-admin-loader');
        if (loader) {
          loader.innerHTML = '<div style="color:#f43f5e;font-size:28px;margin-bottom:8px;">⚠️</div>' +
            '<div style="font-size:1rem;font-weight:700;color:#ffffff;margin-bottom:6px;">Portal Cache Recovery</div>' +
            '<p style="font-size:0.78rem;color:#94a3b8;margin-bottom:14px;max-width:320px;">' + (e.message || 'Cached browser state detected.') + '</p>' +
            '<button onclick="localStorage.clear();if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})})};window.location.reload(true);" style="background:#4f46e5;color:white;border:none;padding:8px 16px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;">Clear Cache & Reload</button>';
        }
      });
    </script>
    <script type="module" crossorigin src="/mindbridge/admin/assets/index-BBFgojXN.js"></script>
    <link rel="stylesheet" crossorigin href="/mindbridge/admin/assets/index-DJ71vdUi.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="mb-admin-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#f8fafc;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;text-align:center;">
        <div style="max-width:380px;background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:32px 28px;box-shadow:0 20px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;gap:12px;">
          <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <div style="font-size:1.15rem;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">MindBridge Admin Portal</div>
          <div style="font-size:0.82rem;color:#94a3b8;">Connecting to live MongoDB backend...</div>
          <div style="width:28px;height:28px;border:3px solid rgba(99,102,241,0.25);border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;margin:6px 0;"></div>
          <div style="font-size:0.75rem;color:#64748b;">Live Healthcare Operations & RBAC</div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
  </body>
</html>
