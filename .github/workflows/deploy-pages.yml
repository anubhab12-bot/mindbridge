name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - prod
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - test
          - uat
          - prod

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install -g npm@11.21.1

      - name: Build Shared Types
        working-directory: packages/shared-types
        run: |
          npm ci
          npm run build

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Angular Web App for GitHub Pages
        working-directory: apps/web
        run: npm run build -- --configuration production --base-href /mindbridge/

      - name: Configure SPA 404 Routing & NoJekyll for GitHub Pages
        run: |
          cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html
          touch apps/web/dist/web/browser/.nojekyll

      - name: Deploy to gh-pages Branch (Branch Deployment)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/dist/web/browser
          force_orphan: true

      - name: Upload GitHub Pages Artifact (Actions Deployment)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: apps/web/dist/web/browser

      - name: Deploy to GitHub Pages (Actions Deployment)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
