name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - prod
      - 'release/**'
      - 'release/*'
      - dev
      - test
      - uat
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - test
          - uat
          - prod

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install -g npm@11.21.1

      - name: Build Shared Types
        working-directory: packages/shared-types
        run: |
          npm ci
          npm run build

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Angular Web App for GitHub Pages
        working-directory: apps/web
        run: |
          npm run build -- --configuration production --base-href /mindbridge/ > build.log 2>&1 || {
            cat build.log
            echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Checkout Admin Portal Branch
        uses: actions/checkout@v4
        with:
          ref: admin-mindbridge
          path: admin-repo

      - name: Build Admin Portal
        working-directory: admin-repo
        run: |
          npm ci
          npm run build
          mkdir -p ../apps/web/dist/web/browser/admin
          cp -r dist/* ../apps/web/dist/web/browser/admin/
          cp dist/index.html ../apps/web/dist/web/browser/admin.html

      - name: Configure SPA 404 Routing & NoJekyll for GitHub Pages
        run: |
          cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html
          touch apps/web/dist/web/browser/.nojekyll

      - name: Deploy to gh-pages Branch (Branch Deployment)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/dist/web/browser
          force_orphan: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist/web/browser
        continue-on-error: true

      - name: Deploy to GitHub Pages (Actions Deployment)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
