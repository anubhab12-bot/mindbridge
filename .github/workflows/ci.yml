name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.21.1

jobs:
  api:
    name: API (lint, typecheck, unit + e2e)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - name: Build shared types
        working-directory: packages/shared-types
        run: npm ci && npm run build
      - name: Install
        working-directory: apps/api
        run: npm ci
      - name: Lint
        working-directory: apps/api
        run: npm run lint
      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/api
        run: npm test
      - name: E2E tests (real MongoDB and Redis)
        working-directory: apps/api
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/mindbridge_e2e
          REDIS_URL_TEST: redis://127.0.0.1:6379/15
        run: npm run test:e2e
      - name: Build
        working-directory: apps/api
        run: npm run build
      - name: Audit production dependencies
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high

  ai-service:
    name: AI service (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest
      - name: Audit dependencies
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes)
        shell: bash

  web:
    name: Web (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - name: Build shared types
        working-directory: packages/shared-types
        run: npm ci && npm run build
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Unit tests
        working-directory: apps/web
        run: npm test -- --watch=false
      - name: Production build
        working-directory: apps/web
        run: npm run build -- --configuration production
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, ai-service, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/api/Dockerfile -t mindbridge-api:ci .
      - run: docker build -t mindbridge-ai:ci apps/ai-service
      - run: docker build -f apps/web/Dockerfile -t mindbridge-web:ci .
