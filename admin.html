<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindBridge Admin Portal | Dynamic Healthcare Operations & RBAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Force unregister any service worker that might interfere with admin assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) {
            r.unregister();
          }
        }).catch(function() {});
      }

      // Auto-recovery fallback: If React has not mounted after 3.5 seconds
      var autoRecoverTimer = setTimeout(function() {
        var loader = document.getElementById('mb-admin-loader');
        if (loader && loader.parentElement) {
          loader.innerHTML = '<div style="max-width:380px;background:#0f172a;border:1px solid #6366f1;border-radius:18px;padding:32px 28px;box-shadow:0 20px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;">' +
            '<div style="width:44px;height:44px;border-radius:12px;background:rgba(99,102,241,0.2);color:#818cf8;display:flex;align-items:center;justify-content:center;font-size:24px;">⚡</div>' +
            '<div style="font-size:1.1rem;font-weight:700;color:#ffffff;">MindBridge Admin Portal</div>' +
            '<p style="font-size:0.8rem;color:#94a3b8;line-height:1.4;">Live updates deployed. Click below to load your active admin console session.</p>' +
            '<button onclick="localStorage.removeItem(\'mindbridge_live_admin_v4_isLoadingLive\');if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).finally(function(){window.location.reload(true)});}else{window.location.reload(true);}" style="background:#6366f1;color:#ffffff;border:none;padding:10px 22px;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 8px 16px rgba(99,102,241,0.3);">Open Live Admin Portal</button>' +
          '</div>';
        }
      }, 3000);

      // Dismiss recovery timer once React mounts
      window.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        if (root) {
          var observer = new MutationObserver(function(mutations, obs) {
            if (!document.getElementById('mb-admin-loader')) {
              clearTimeout(autoRecoverTimer);
              obs.disconnect();
            }
          });
          observer.observe(root, { childList: true });
        }
      });

      // Catch global unhandled script failures
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('mb-admin-loader');
        if (loader && loader.parentElement) {
          loader.innerHTML = '<div style="max-width:380px;background:#0f172a;border:1px solid #f43f5e;border-radius:18px;padding:32px 28px;box-shadow:0 20px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;">' +
            '<div style="color:#f43f5e;font-size:28px;">⚠️</div>' +
            '<div style="font-size:1rem;font-weight:700;color:#ffffff;">Portal Cache Recovery</div>' +
            '<p style="font-size:0.78rem;color:#94a3b8;max-width:320px;">' + (e.message || 'Cached browser state detected.') + '</p>' +
            '<button onclick="localStorage.clear();if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})})};window.location.reload(true);" style="background:#4f46e5;color:white;border:none;padding:8px 16px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;">Clear Cache & Reload</button>' +
          '</div>';
        }
      }, true);
    </script>
    <script type="module" crossorigin src="/mindbridge/admin/assets/index-BeQbMk3E.js"></script>
    <link rel="stylesheet" crossorigin href="/mindbridge/admin/assets/index-B-gsbkMQ.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="mb-admin-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#f8fafc;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;text-align:center;">
        <div style="max-width:380px;background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:32px 28px;box-shadow:0 20px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;gap:12px;">
          <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <div style="font-size:1.15rem;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">MindBridge Admin Portal</div>
          <div style="font-size:0.82rem;color:#94a3b8;">Connecting to live MongoDB backend...</div>
          <div style="width:28px;height:28px;border:3px solid rgba(99,102,241,0.25);border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;margin:6px 0;"></div>
          <div style="font-size:0.75rem;color:#64748b;">Live Healthcare Operations & RBAC</div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
  </body>
</html>
