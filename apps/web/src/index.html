<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MindBridge</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MindBridge: emotional support, self-help tools and verified mental health professionals.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mb_theme');
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>MindBridge needs JavaScript. If you are in immediate danger, call your local emergency number now.</noscript>
</body>
</html>
