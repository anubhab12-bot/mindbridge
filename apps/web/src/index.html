<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MindBridge · Clinical Mental Healthcare & Telehealth</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MindBridge: emotional support, self-help tools and verified mental health professionals.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MindBridge">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    (function () {
      try {
        var userChoice = localStorage.getItem('mb_theme_v2');
        if (!userChoice) {
          localStorage.removeItem('mb_theme');
        }
        var theme = userChoice === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root>
    <!-- Instant branded splash loader shown while JS bundles load -->
    <div id="mb-initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1527;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;z-index:99999;padding:20px;text-align:center;">
      <div class="mb-card" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
          <span class="mb-title" style="font-size:1.5rem;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">MindBridge</span>
        </div>
        <div style="width:32px;height:32px;border:3px solid rgba(13,148,136,0.25);border-top-color:#0d9488;border-radius:50%;animation:mbSpin 0.75s linear infinite;margin:6px 0;"></div>
        <div class="mb-sub" style="font-size:0.92rem;font-weight:600;color:#94a3b8;">Loading healthcare portal...</div>
        <div style="font-size:0.78rem;color:#64748b;margin-top:2px;">24/7 Crisis Helpline: <strong style="color:#38bdf8;">14416</strong></div>
      </div>
    </div>
    <style>
      @keyframes mbSpin { to { transform: rotate(360deg); } }
      [data-theme="light"] #mb-initial-loader { background: #f8fafc; color: #0f172a; }
      [data-theme="light"] #mb-initial-loader .mb-card { background: #ffffff; border-color: #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
      [data-theme="light"] #mb-initial-loader .mb-title { color: #0f172a !important; }
      [data-theme="light"] #mb-initial-loader .mb-sub { color: #475569 !important; }
    </style>
  </app-root>
  <noscript>MindBridge needs JavaScript. If you are in immediate danger, call your local emergency number now.</noscript>
</body>
</html>
