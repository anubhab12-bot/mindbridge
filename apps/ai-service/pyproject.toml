[project]
name = "mindbridge-ai-service"
version = "0.1.0"
description = "MindBridge AI service: provider abstraction, layered safety screening, crisis handling, RAG and doctor drafting."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "E501"]  # line length is enforced by `ruff format`; long regex literals stay readable

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
