# Local full stack. Copy .env.example to .env and replace every CHANGE_ME first.
#   docker compose up --build
#   open http://localhost:8080   (Mailpit inbox: http://localhost:8025)
name: mindbridge

x-api-env: &api-env
  MONGO_URI: mongodb://${MONGO_ROOT_USER:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongo:27017/mindbridge?authSource=admin
  REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379
  AI_SERVICE_URL: http://ai-service:8000
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  CORS_ORIGINS: http://localhost:8080
  WEB_APP_URL: http://localhost:8080
  UPLOAD_DIR: /repo/apps/api/var/uploads

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]

  ai-service:
    build: { context: ./apps/ai-service }
    restart: unless-stopped
    env_file: .env

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    volumes: [uploads:/repo/apps/api/var/uploads]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai-service: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: *api-env
    healthcheck: { disable: true }
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]

volumes:
  mongo-data:
  redis-data:
  uploads:
